name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: PortAudio (Linux only; the Windows/macOS wheels bundle it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Dry run of the whole benchmark (simulated Pi, no sound)
        run: python benchmark.py --mode sim --no-audio --yes --fresh --size quick --limit 5 --gap-min 1 --gap-max 1.2 --wake-word Watson --student ci
